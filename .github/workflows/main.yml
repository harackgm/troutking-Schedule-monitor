name: TroutKing Schedule Monitor

# 実行タイミングの設定
on:
  schedule:
    # 毎日 日本時間 午前8時 (UTC 前日 23:00) に実行
    - cron: '0 23 * * *'
  # 手動実行用ボタンを追加
  workflow_dispatch:

# リポジトリに変更を保存（プッシュ）するための権限設定
permissions:
  contents: write

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: スクリプトの実行
        run: python main.py
        # 後ほどLINEのTokenなどをここに環境変数として設定します

      - name: DBファイル（変更差分）の保存とコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule_db.json
          # 変更がある場合のみコミットしてプッシュする
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update schedule DB" && git push)
